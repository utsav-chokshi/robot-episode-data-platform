name: Platform checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
        env:
          POSTGRES_USER: rdp_test_admin
          POSTGRES_PASSWORD: isolated-ci-test-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rdp_test_admin -d postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      RDP_TEST_DATABASE_URL: postgresql+psycopg://rdp_test_admin:isolated-ci-test-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipelines.lock
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-pipelines.lock && python -m pip install -r requirements-build.txt
      - name: Install application
        run: python -m pip install --no-deps --no-build-isolation .
      - name: Check migrations, API, capture, ingestion and analytics
        run: python -m pytest -q

  simulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: isolated-ci-not-used-by-simulator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build pinned CPU simulator and robot asset
        run: docker compose --profile simulation build simulator
      - name: Run structured-task and capture development suite
        run: docker compose --profile simulation run --rm simulator suite

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_PASSWORD: isolated-ci-not-used-by-dashboard-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build isolated dashboard environment
        run: docker compose --profile dashboard build dashboard
      - name: Check read-only views and planned-versus-measured labels
        run: docker compose --profile dashboard run --no-deps --rm dashboard /opt/dashboard/bin/python -m pytest -q -p no:cacheprovider tests/test_dashboard.py
