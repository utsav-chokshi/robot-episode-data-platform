[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "robotics-data-platform"
version = "0.1.0"
description = "A local robotics episode data and evaluation platform."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{name = "Utsav Chokshi"}]
dependencies = [
  "fastapi==0.162.2",
  "pydantic-settings==2.16.2",
  "SQLAlchemy==2.1.8",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.8",
  "uvicorn==0.54.0",
  "pillow==11.3.0",
]

[project.optional-dependencies]
test = ["pytest==9.2.0", "httpx==0.28.1"]
simulation = ["mujoco==3.3.7", "numpy==2.5.4", "pillow==11.3.0"]
pipelines = ["pyarrow==26.0.1", "duckdb==2.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires a dedicated PostgreSQL test service"]
